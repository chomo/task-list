<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<link rel="icon" href="data:," />
<title>タスクリスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Noto+Serif+JP:wght@600;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<div class="bgfx" aria-hidden="true">
  <div class="lines" id="bgLines"></div>
  <div class="wave w1"></div><div class="wave w2"></div>
  <div class="diamonds"></div>
</div>
<div class="frame" aria-hidden="true"></div>
<div class="wipe" id="wipe" aria-hidden="true"><i></i><i></i></div>
<canvas id="burstCanvas" aria-hidden="true"></canvas>

<div class="app">
  <header class="top">
    <div class="datebig">
      <span class="d" id="dateBig">--/--</span>
      <span class="dow" id="dowBig">---</span>
      <span class="clock" id="clockBig">--:--</span>
    </div>
    <div class="headstat">
      <div class="hs"><b id="hsRemain">0</b><span>残タスク</span></div>
      <div class="hs"><b id="hsRate">0<em>%</em></b><span>達成率</span></div>
      <div class="hs"><b id="hsDone">0</b><span>完了済み</span></div>
    </div>
  </header>

  <div class="layout">
    <nav class="menu locked collapsed" id="menu" aria-label="メインメニュー">
      <div class="mhead">
        <p class="mtitle">COMMAND — 命令</p>
        <button type="button" class="mtoggle" id="menuToggle" aria-expanded="false" aria-controls="menuItems" aria-label="メニューを開く"><span class="mtog-label">開く</span><span class="mtog-arrow" aria-hidden="true">▼</span></button>
      </div>
      <div id="menuItems"></div>
    </nav>
    <section class="stage" id="stage" aria-live="polite"></section>
  </div>

  <footer class="hints">
    <span><b>↑↓</b> 選択</span><span><b>ENTER</b> 決定</span><span><b>ESC</b> 戻る</span>
    <span><b>SPACE</b> 完了切替</span><span><b>N</b> 新規タスク</span><span><b>/</b> 検索</span>
  </footer>
</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true"></div>
<div class="fabbar" id="fabbar">
  <button type="button" class="fab fab-search" id="fabSearch" aria-label="検索を開く" aria-expanded="false" aria-controls="searchBody">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="15.5" y1="15.5" x2="21" y2="21"/></svg>
  </button>
  <button type="button" class="fab fab-add" id="fabAdd" aria-label="クイック追加を開く" aria-expanded="false">＋</button>
</div>
<div class="toast" id="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden />

<script type="module" src="./src/main.js"></script>
</body>
</html>
